<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)" />
    <title>trame — Google Maps for your frontend architecture</title>
    <meta
      name="description"
      content="Parse any TypeScript codebase and explore it as an interactive 3D map. See impact, trace paths, detect cycles, enforce architecture rules in CI."
    />
    <meta property="og:url" content="https://trame-61t.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="trame" />
    <meta
      property="og:description"
      content="Google Maps for your frontend architecture. Explore, understand, enforce."
    />
    <!-- Absolute, because the platforms that fetch this never resolve relative
         paths. Declaring summary_large_image without an image, as this page did,
         reserves a wide card and then leaves it blank. -->
    <meta property="og:image" content="https://trame-61t.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The trame landing page: a 3D dependency graph of trame's own source, beside the headline Google Maps for your frontend architecture."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://trame-61t.pages.dev/og.png" />
    <!-- the graph is 16 kB and used on first paint; without this it would queue
         behind the renderer chunk that does not need to block anything -->
    <link rel="preload" href="/demo.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
